<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubies Organic — Offline</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: linear-gradient(135deg, #FFF8ED 0%, #F5E6D0 100%);
        color: #3D2817;
        font-family: 'Outfit', sans-serif;
      }
      .card {
        max-width: 560px;
        background: white;
        border: 1px solid #E8D9BC;
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 20px 45px rgba(61, 40, 23, 0.12);
      }
      h1 { font-family: 'Fraunces', serif; font-size: 2rem; margin-bottom: 0.75rem; }
      p { line-height: 1.6; color: #6B4423; }
      .pill { display: inline-block; margin-top: 1rem; padding: 0.6rem 0.9rem; border-radius: 999px; background: #F5E6D0; color: #6B4423; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>The site shell is available locally, but live contact and order delivery need an internet connection. You can still review the cached content and try again when you reconnect.</p>
      <div class="pill">Rubies Organic • offline mode</div>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
